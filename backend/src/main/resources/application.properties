spring.application.name=backend

spring.datasource.url=jdbc:h2:file:./data/videojuegosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# Evita que Hibernate cree columnas obligatorias en tablas que ya tienen datos
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# La cuenta con este correo es la administradora de la tienda
tienda.admin.correo=jugador@videojuegos.com

# Tasa de impuesto aplicada al carrito (18 %)
app.carrito.tasa-impuesto=0.18

# Tipo de cambio usado para cobrar con Yape (1 USD = N PEN)
pago.tipo-cambio-pen=3.75

# Stripe en modo prueba. Define estas variables en tu entorno o en
# application-local.properties; nunca subas las claves reales al repositorio.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Correo de confirmación (Mailtrap para pruebas).
spring.mail.host=${MAILTRAP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAILTRAP_PORT:2525}
spring.mail.username=${MAILTRAP_USERNAME:}
spring.mail.password=${MAILTRAP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.correo.remitente=${CORREO_REMITENTE:no-reply@videojuegos.test}
app.correo.habilitado=${CORREO_HABILITADO:true}